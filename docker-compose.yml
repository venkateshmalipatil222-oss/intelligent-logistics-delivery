version: "3.9"

services:
  # -------------------------------------------------------------
  # 1. MySQL 8 Database Service
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: ildo_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ildo_db
      MYSQL_USER: ildo_user
      MYSQL_PASSWORD: ildo_password
      MYSQL_ROOT_PASSWORD: ildo_root_password
    ports:
      - "3306:3306"
    volumes:
      - ildo_mysql_data:/var/lib/mysql
    networks:
      - ildo_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u ildo_user --password=ildo_password || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # -------------------------------------------------------------
  # 2. FastAPI Intelligence & Logistics Backend Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ildo_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      PROJECT_NAME: "Intelligent Logistics & Delivery Optimization Platform"
      SECRET_KEY: "enterprise_grade_super_secret_key_ildo_2026_prod!"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ildo_user
      DB_PASSWORD: ildo_password
      DB_NAME: ildo_db
      DATABASE_URL: "mysql+pymysql://ildo_user:ildo_password@mysql:3306/ildo_db"
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:5173", "http://127.0.0.1"]'
    ports:
      - "8000:8000"
    networks:
      - ildo_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  # -------------------------------------------------------------
  # 3. React Single Page Application (Nginx reverse-proxy)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ildo_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - ildo_network

volumes:
  ildo_mysql_data:
    driver: local

networks:
  ildo_network:
    driver: bridge
